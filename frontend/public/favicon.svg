<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect width="128" height="128" rx="36" fill="url(#bgGrad)" />
  <rect width="124" height="124" x="2" y="2" rx="34" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" />

  <!-- Outer Ping Wave -->
  <path d="M78 30 C96 36, 106 52, 102 72" stroke="rgba(255, 255, 255, 0.4)" stroke-width="5" stroke-linecap="round" fill="none" />
  
  <!-- Middle Ping Wave -->
  <path d="M70 40 C82 45, 88 56, 85 70" stroke="rgba(255, 255, 255, 0.7)" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Main Message / Ping Shape -->
  <path d="M34 36 C34 29.37 39.37 24 46 24 H64 C70.63 24 76 29.37 76 36 V62 C76 68.63 70.63 74 64 74 H48 L34 86 V36 Z" fill="white" filter="url(#glow)" />

  <!-- Electric Instant Ping Bolt inside bubble -->
  <path d="M57 32 L44 52 H54 L51 68 L66 46 H56 L57 32 Z" fill="url(#bgGrad)" stroke="#4f46e5" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Active Status Ping Dot -->
  <circle cx="94" cy="94" r="9" fill="#10b981" stroke="#0f172a" stroke-width="3.5" />
</svg>