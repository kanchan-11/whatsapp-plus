name: CI/CD Pipeline - Build & Deploy InstantPing

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # 1. CI - Build Verification
  test_and_build:
    name: Build & Verify Codebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Backend Build Verification
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot Backend
        run: |
          cd backend
          mvn clean package -DskipTests -B

      # Frontend Build Verification
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # 2. CD - Automated Server Deployment via SSH
  deploy:
    name: Deploy to Production Server
    needs: test_and_build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting InstantPing deployment..."
            
            # Navigate to application directory
            cd ~/instantping || cd /root/instantping
            
            # Fetch and apply latest changes
            git fetch origin main
            git reset --hard origin/main
            
            # Rebuild and restart Docker containers with zero downtime disruption
            docker compose up --build -d
            
            # Clean up dangling images to conserve disk space
            docker image prune -f
            
            echo "✅ InstantPing successfully deployed and live!"
